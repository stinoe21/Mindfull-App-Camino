<!-- @dsCard group="Colors" viewport="700x140" name="Weather Palette" subtitle="Maps directly to check-in outcomes — never good/bad" -->
<html><head><link rel="stylesheet" href="../preview.css"></head>
<body style="margin:0;font-family:var(--font-body)">
<div style="display:flex;padding:20px 24px;gap:14px">
<script>
document.currentScript.replaceWith(...[['sun','Zonnig'],['cloud','Wolken'],['mist','Mist'],['rain','Regen'],['storm','Storm']].map(([k,l])=>{const d=document.createElement('div');d.style="display:flex;flex-direction:column;gap:6px;width:80px";d.innerHTML=`<div style="height:44px;border-radius:8px;background:var(--weather-${k});box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div><span style="font-size:10px;color:var(--text-secondary)">${l}</span>`;return d;}));
</script>
</div>
</body></html>
