<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="4px base unit" -->
<html><head><link rel="stylesheet" href="../preview.css"></head>
<body style="margin:0;padding:20px 24px;display:flex;align-items:flex-end;gap:10px;background:var(--surface-background)">
<script>
document.currentScript.replaceWith(...[4,8,12,16,20,24,32,40,48].map(s=>{const d=document.createElement('div');d.style="display:flex;flex-direction:column;align-items:center;gap:6px";d.innerHTML=`<div style="width:${s}px;height:${s}px;background:var(--primary-500);border-radius:3px"></div><span style="font-size:10px;color:var(--text-secondary);font-family:var(--font-body)">${s}</span>`;return d;}));
</script>
</body></html>
