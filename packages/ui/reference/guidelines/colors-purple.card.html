<!-- @dsCard group="Colors" viewport="700x140" name="Purple" subtitle="Quote / reflection accent" -->
<html><head><link rel="stylesheet" href="../preview.css"></head>
<body style="margin:0;font-family:var(--font-body)">
<div style="display:flex;padding:20px 24px;gap:8px">
<script>
document.currentScript.replaceWith(...['50','100','200','300','400','500'].map(s=>{const d=document.createElement('div');d.style="display:flex;flex-direction:column;gap:6px;width:56px";d.innerHTML=`<div style="height:44px;border-radius:8px;background:var(--purple-${s})"></div><span style="font-size:10px;color:var(--text-secondary)">${s}</span>`;return d;}));
</script>
</div>
</body></html>
