<!-- @dsCard group="Colors" viewport="700x140" name="Neutral" subtitle="Text, borders, surfaces" -->
<html><head><link rel="stylesheet" href="../preview.css"></head>
<body style="margin:0;font-family:var(--font-body)">
<div style="display:flex;padding:20px 24px;gap:8px;flex-wrap:wrap">
<script>
document.currentScript.replaceWith(...['0','50','100','200','300','400','500','600','700','800','900'].map(s=>{const d=document.createElement('div');d.style="display:flex;flex-direction:column;gap:6px;width:56px";d.innerHTML=`<div style="height:44px;border-radius:8px;background:var(--neutral-${s});box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div><span style="font-size:10px;color:var(--text-secondary)">${s}</span>`;return d;}));
</script>
</div>
</body></html>
