<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="Pill buttons, 16px cards, 24px sheet corners" -->
<html><head><link rel="stylesheet" href="../preview.css"></head>
<body style="margin:0;padding:20px 24px;display:flex;align-items:center;gap:20px;background:var(--surface-background)">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:60px;height:40px;background:var(--primary-100);border-radius:8px"></div><span style="font-size:10px;color:var(--text-secondary);font-family:var(--font-body)">sm · 8</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:60px;height:60px;background:var(--primary-100);border-radius:16px"></div><span style="font-size:10px;color:var(--text-secondary);font-family:var(--font-body)">md · 16 (cards)</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:60px;height:60px;background:var(--primary-100);border-radius:24px 24px 0 0"></div><span style="font-size:10px;color:var(--text-secondary);font-family:var(--font-body)">lg · 24 (sheet top)</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:60px;height:32px;background:var(--accent-lime);border-radius:999px"></div><span style="font-size:10px;color:var(--text-secondary);font-family:var(--font-body)">pill · 999 (buttons)</span></div>
</body></html>
